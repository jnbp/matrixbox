# Keeps the pull request branch "add-departures-plus" in step with the app's own repository,
# https://github.com/jnbp/matrixbox-departures-plus, so the files in the pull request are exactly
# the released ones and nobody copies them by hand.
#
# This file lives only on the branch "import-helper" of the fork and is never part of the pull request.
# To bring a new app version into the pull request: set SOURCE_REF to its release tag and push.
#
#   FRESH: "true"   one clean commit on top of the current upstream main (replaces the branch)
#   FRESH: "false"  an "Update" commit on top of the branch, for a pull request that is under review
name: Sync Departures Plus into the pull request branch

on:
  push:
    branches:
      - import-helper

env:
  SOURCE_REF: v0.8.0
  FRESH: "true"
  BRANCH: add-departures-plus

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: jnbp/matrixbox-departures-plus
          ref: ${{ env.SOURCE_REF }}
          path: _src
      - name: Commit the app onto the pull request branch
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' _src/departuresplus/dp_cfg.py)
          git config user.name "jnbp"
          git config user.email "50960701+jnbp@users.noreply.github.com"
          git remote add upstream https://github.com/MatrixBOX-dev/matrixbox.git
          git fetch --quiet upstream main
          if [ "$FRESH" = "true" ]; then
            git checkout --quiet -B "$BRANCH" upstream/main
            title="Add Departures Plus app"
          else
            git checkout --quiet -B "$BRANCH" "origin/$BRANCH"
            title="Update Departures Plus to $version"
          fi
          rm -rf apps/departuresplus
          mkdir -p apps/departuresplus
          cp _src/departuresplus/* apps/departuresplus/
          git add -A apps/departuresplus
          if git diff --cached --quiet; then echo "Nothing to do."; exit 0; fi
          git commit --quiet -m "$title" -m "Departure board with station rotation, line colors, a status row with clock and ticker, and a local API for Home Assistant. Version $version." -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01FNnN95mVya2tgMrPWK5BEG"
          git push --force origin "$BRANCH"
